# Rootverwaltete Bash-Konfiguration. Keine Geheimnisse. Nach Installation nur root schreibbar.
SLOTS=(s01 s02 s03 s04 s05 s06 s07 s08 s09 s10)
DEFAULT_SLOTS=s01,s02
SLOT_GROUP=cocopi-slots
# Feste reservierte IDs vermeiden Wiederverwendung einer purgierten Slot-UID durch
# einen anderen Slot. Vor Apply Kollisionen prüfen; hostweite Reservierung separat.
SLOT_UID_BASE=20000
HOME_BASE=/home
DATA_MOUNT=/mnt/data
DATA_BASE=/mnt/data/cocopi
NVME_MOUNT=/
CPU_QUOTA=100%
MEMORY_HIGH=2G
MEMORY_MAX=2560M
TASKS_MAX=256
# Quota-Werkzeuge verwenden KiB: exakt 10 + 70 GB dezimal, nicht GiB.
NVME_QUOTA_KIB=9765625
DATA_QUOTA_KIB=68359375
NVME_INODES=200000
DATA_INODES=800000
HUB_MAX_OPEN_SESSIONS=2
HUB_MAX_ACTIVE_SESSIONS=1
GLOBAL_HEAVY_JOBS=1
HUB_PORT_BASE=8800
# s01 -> 8801, …, s10 -> 8810 (Reserve; nicht automatisch provisionieren).
HUB_BIND=127.0.0.1
# Vor Apply separat aus geprüftem Hub-Commit rootverwaltet bereitstellen.
HUB_DIR=/opt/cocopi/pi-hub
HUB_NODE=/usr/bin/node
HUB_PI=/opt/cocopi/bin/pi
TOOL_PATH=/opt/cocopi/bin:/usr/local/bin:/usr/bin:/bin
REQUIRED_TOOLS=(node pi cargo rustc python3 git ffmpeg cc make)
# Erst nach A4-/Sicherheitsabnahme durch S3 setzen; keine Feature-Erkennung per grep.
HUB_CONTRACT=unconfirmed
REQUIRED_HUB_CONTRACT=cocopi-slots-v1
HUB_CONTRACT_FILE=/opt/cocopi/pi-hub/slots-contract
# Sicherungen zunächst lokal root-only für Rückbau; kein Ersatz für externes Backup.
ARCHIVE_BASE=/var/backups/cocopi-slots
STATE_BASE=/var/lib/cocopi-slots
