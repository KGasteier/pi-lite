[workspace]
resolver = "2"
members = ["crates/md-core", "crates/md-egui", "crates/pi-backend", "crates/pi-net", "crates/pi-sync", "app"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
