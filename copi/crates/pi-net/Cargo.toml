[package]
name = "pi-net"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Frontendunabhängiger cocopi-Kern und experimenteller iroh-Direkttransport"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
getrandom = "0.3"
