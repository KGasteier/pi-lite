[package]
name = "copi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Natives egui-Frontend für pi (Nachfolger-Prototyp von pi-lite)"

[features]
default = []
cocopi = ["dep:pi-net"]

[[bin]]
name = "cocopi"
path = "src/cocopi.rs"
required-features = ["cocopi"]

[dependencies]
pi-net = { path = "../crates/pi-net", optional = true }
eframe.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
pi-backend = { path = "../crates/pi-backend" }
md-egui = { path = "../crates/md-egui" }
md-core = { path = "../crates/md-core" }
base64 = "0.22"
png = "0.17.16"
libc = "0.2"
